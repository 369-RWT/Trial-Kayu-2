version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: alfathkayu-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: alfathkayu
      POSTGRES_PASSWORD: alfathkayu_dev_pass
      POSTGRES_DB: alfathkayu_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alfathkayu -d alfathkayu_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    name: alfathkayu_postgres_data
